<main>
  <h2 class="form-part-head">教育经历</h2>
  <div class="records">
    <article class="ux-standard-form">
      <div class="form-item form-item--phoenix">
        <div class="form-item__text">学校名称 *</div>
        <input name="school_1" />
      </div>
      <div class="form-item form-item--phoenix">
        <div class="form-item__text">学历</div>
        <div class="phoenix-select"><input readonly placeholder="请选择学历" /></div>
      </div>
      <div class="form-item form-item--phoenix">
        <div class="form-item__text">毕业时间</div>
        <div class="phoenix-month-picker"><input readonly placeholder="YYYY-MM" format="YYYY-MM" /></div>
      </div>
    </article>
    <article class="ux-standard-form">
      <div class="form-item form-item--phoenix">
        <div class="form-item__text">学校名称 *</div>
        <input name="school_2" />
      </div>
      <div class="form-item form-item--phoenix">
        <div class="form-item__text">学历</div>
        <div class="phoenix-select"><input readonly placeholder="请选择学历" /></div>
      </div>
    </article>
    <button type="button" class="phoenix-button add-record">添加教育经历</button>
    <button type="button" class="phoenix-button upload-file">添加附件</button>
  </div>
</main>
