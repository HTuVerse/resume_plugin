<main>
  <section class="applyFormModuleWrapper-a17">
    <h2 class="applyFormModuleWrapper-text-a17">基本信息</h2>
    <div class="ud-formily-item" data-form-field-id="candidate-name">
      <div class="ud-formily-item-label-content">姓名 *</div>
      <input name="candidateName" placeholder="请输入姓名" />
    </div>
    <div class="ud-formily-item" data-form-field-id="degree">
      <div class="ud-formily-item-label-content">最高学历</div>
      <div class="ud-select" data-form-field-name="degree">
        <div class="ud-select-view"><input aria-autocomplete="list" readonly placeholder="请选择最高学历" /></div>
      </div>
    </div>
    <div class="ud-formily-item" data-form-field-id="city">
      <div class="ud-formily-item-label-content">期望工作城市</div>
      <div class="ud-cascader"><input aria-haspopup="tree" readonly placeholder="请选择城市" /></div>
    </div>
  </section>
</main>
