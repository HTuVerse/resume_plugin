<main class="application-form-shell">
  <section>
    <h2 class="module-title-v2">基本信息</h2>
    <div class="apply-field-a81">
      <div class="title-b20">姓名 *</div>
      <input name="candidateName" placeholder="请输入姓名" />
    </div>
    <div class="apply-field-a81">
      <div class="title-b20">最高学历</div>
      <div class="sd-Select-container-x92" data-form-field-name="degree">
        <div class="sd-Select-control-x92"><input aria-autocomplete="list" readonly placeholder="请选择最高学历" /></div>
      </div>
    </div>
  </section>
  <section>
    <h2 class="module-title-v2">教育经历</h2>
    <article class="resume-item-x1">
      <div class="apply-field-a81"><div class="title-b20">学校名称</div><input name="school" /></div>
      <div class="apply-field-a81"><div class="title-b20">专业名称</div><input name="major" /></div>
    </article>
    <button type="button" class="add-record">添加教育经历</button>
    <button type="button" class="upload-resume">上传附件</button>
    <button type="submit">提交申请</button>
  </section>
</main>
